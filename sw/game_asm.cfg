# ld65 map for assembly games: loaded by the boot ROM at $9000 (20 KB), entry point = first byte.
MEMORY {
    ZP:   start = $0010, size = $00E0, type = rw;
    RAM:  start = $0400, size = $7C00, type = rw;
    GAME: start = $9000, size = $5000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = GAME, type = rw;
    RODATA:   load = GAME, type = ro;
    DATA:     load = GAME, type = rw;
    BSS:      load = RAM,  type = bss, define = yes;
}
