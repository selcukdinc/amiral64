# ld65 map for big C games with extra data (EKDATA): like game_c_low.cfg (code and data loaded at $0400,
# up to $7FFF), but the game RAM is split: variables and the C stack in $9000-$AFFF, and $B000-$DFFF holds
# the extra data. The extra data is written to <output>.ek; tools/mkcart.py puts it right after the game in
# the cartridge, so when the game starts the cartridge port points at it and k_ek_yukle() reads it in.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   start = $0010, size = $00F0, type = rw, define = yes;
    GAME: start = $0400, size = $7C00, type = rw, file = %O, define = yes;
    RAM:  start = $9000, size = $2000 - __STACKSIZE__, type = rw, define = yes;
    EK:   start = $B000, size = $3000, type = rw, file = "%O.ek", define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = GAME, type = ro;
    LOWCODE:  load = GAME, type = ro, optional = yes;
    ONCE:     load = GAME, type = ro, optional = yes;
    CODE:     load = GAME, type = ro;
    RODATA:   load = GAME, type = ro;
    DATA:     load = GAME, type = rw;
    BSS:      load = RAM,  type = bss, define = yes;
    EKDATA:   load = EK,   type = rw, define = yes, optional = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
