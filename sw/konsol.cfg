# ld65 memory map of the retro konsol (boot ROM image: 8 KB at $E000, vectors at $FFFA).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0400, size = $7C00, type = rw;   # $0200 vectors, $0300 OAM shadow
    ROM:    start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    API:      load = ROM, type = ro, start = $FFF0, optional = yes;   # jmp api_load_game
    VECTORS:  load = ROM, type = ro, start = $FFFA;
}
